# Mosquitto for Emmaforo remote control.
# The broker only relays sealed payloads on random topic names: it cannot read
# commands or lamp state, and it is configured to keep as little as possible.

per_listener_settings false

listener 8883
protocol mqtt
certfile /etc/letsencrypt/live/emmaforo.michelebigi.it/fullchain.pem
keyfile /etc/letsencrypt/live/emmaforo.michelebigi.it/privkey.pem
tls_version tlsv1.2

# No accounts: lamps and phones are anonymous. Access is limited by the ACL to
# the emmaforo/<id>/cmd and emmaforo/<id>/state topics, and every payload is
# authenticated end to end, so a stranger can neither read nor forge commands.
allow_anonymous true
acl_file /etc/mosquitto/emmaforo.acl

# Commands sent while a lamp sleeps wait here (sealed). Abandoned sessions and
# their queues are dropped after two weeks.
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 300
persistent_client_expiration 14d
max_queued_messages 20
max_inflight_messages 5
max_packet_size 1024
max_keepalive 600

# No connection logs: no IP addresses or client ids are written to disk.
connection_messages false
log_type error
log_dest stderr
log_timestamp false
